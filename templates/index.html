<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHS Chat Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      text-align: center;
    }
    #chat-box {
      background: white;
      padding: 20px;
      margin: 0 auto;
      width: 90%;
      max-width: 500px;
      height: 400px;
      overflow-y: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      text-align: left;
    }
    .user { color: blue; }
    .bot { color: green; }
    input {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #aaa;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #28a745;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🤖 GHS Chat Assistant</h1>
  <div id="chat-box"></div>
  <input id="user-input" type="text" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    async function sendMessage() {
      const userMessage = document.getElementById("user-input").value;
      const chatBox = document.getElementById("chat-box");

      chatBox.innerHTML += `<p class='user'><b>You:</b> ${userMessage}</p>`;
      document.getElementById("user-input").value = "";

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage })
      });

      const data = await response.json();
      if (data.reply) {
        chatBox.innerHTML += `<p class='bot'><b>Bot:</b> ${data.reply}</p>`;
      } else {
        chatBox.innerHTML += `<p class='bot'><b>Error:</b> ${data.error}</p>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
